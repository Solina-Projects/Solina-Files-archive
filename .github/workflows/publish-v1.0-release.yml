name: Publish Solina Files Release

on:
  # Publish whenever the app version is bumped on main.
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solina-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME" || { echo "Could not read versionName from app/build.gradle.kts"; exit 1; }
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: Solina Files ${{ steps.version.outputs.tag }}
          body: |
            Solina Files ${{ steps.version.outputs.tag }} — Android debug APK for testing.

            - Source: main branch
            - Includes searchable installed-app management and safer APK/DEX inspection.
            - Improves file transfer reporting and removes incomplete vault files after encryption errors.
            - Minimum Android version: Android 11 (API 30).
            - APK type: debug build; not signed with a production release key.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
