name: Build & Test Solina Files

on:
  push:
    branches: [ main, feature/advanced-file-manager, feature/strata-dual-pane-integration, feature/strata-v1.0.0-full-dual-pane-replacement ]
  pull_request:
    branches: [ main, feature/strata-dual-pane-integration ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Solina Files Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew (if present)
        run: chmod +x gradlew 2>/dev/null || true

      - name: Install Android NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Format and test Rust core
        run: |
          cargo fmt --manifest-path rust-core/Cargo.toml
          cargo test --manifest-path rust-core/Cargo.toml

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Run Kotlin unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      # Exercise the optimized release variant so R8/ProGuard rules are tested in CI.
      # bundleRelease creates an unsigned AAB; signing and publishing remain manual.
      - name: Build optimized Release App Bundle
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolinaFiles-v1.0-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolinaFiles-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Send Telegram Alert on Failure
        if: ${{ failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚨 *Solina Files CI Alert: Build Failed*
            
            • *Branch:* `${{ github.ref_name }}`
            • *Commit:* `${{ github.sha }}`
            • *Author:* ${{ github.actor }}
            • *Run:* #${{ github.run_number }}
            
            [👉 View Workflow Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
