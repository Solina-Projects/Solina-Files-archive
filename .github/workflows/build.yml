name: Build & Test Solina Files

on:
  push:
    branches: [ main, feature/advanced-file-manager, feature/strata-dual-pane-integration, feature/ui-ux-refresh-v2.1 ]
  pull_request:
    branches: [ main, feature/strata-dual-pane-integration ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Solina Files Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew (if present)
        run: chmod +x gradlew 2>/dev/null || true

      - name: Run JVM Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolinaFiles-ui-ux-refresh-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Send Telegram Alert on Failure
        if: ${{ failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚨 *Solina Files CI Alert: Build Failed*
            
            • *Branch:* `${{ github.ref_name }}`
            • *Commit:* `${{ github.sha }}`
            • *Author:* ${{ github.actor }}
            • *Run:* #${{ github.run_number }}
            
            [👉 View Workflow Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
